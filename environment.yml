name: DuoGesture
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - git                        # conda git avoids GLIBC issues on older nodes
  - cudatoolkit=11.8
  - ffmpeg                     # required to build av (PyAV)
  - pip:
    # PyTorch: install from the official wheel index for CUDA 12.1 support
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.1.0
    - torchaudio==2.1.0
    - torchvision==0.16.0
    - triton==2.1.0
    - numpy
    - scipy==1.10.1
    - scikit-learn==1.3.2
    - librosa==0.11.0
    - soundfile==0.13.1
    - transformers==4.39.3
    - tokenizers==0.15.2
    - huggingface-hub==0.34.4
    - safetensors==0.5.3
    - faster-whisper==1.0.0
    - whisperx==3.2.0
    - pyannote.audio==3.1.1
    - speechbrain==1.0.3
    - einops==0.8.1
    - omegaconf==2.3.0
    - hydra-core==1.3.2
    - wandb==0.21.1
    - tensorboard==2.14.0
    - tensorboardX==2.6.2.2
    - pytorch-lightning==2.4.0
    - lightning==2.3.3
    - torchmetrics==1.5.2
    - smplx==0.1.28
    - trimesh==4.7.4
    - pyrender==0.1.45
    - opencv-python==4.12.0.88
    - matplotlib==3.7.5
    - pandas==2.0.3
    - numba==0.58.1
    - llvmlite==0.41.1
    - umap-learn==0.5.7
    - lmdb==1.7.3
    - loguru==0.7.3
    - ConfigArgParse==1.7.1
    - PyYAML
    - tqdm==4.67.1
    - requests
    - https://github.com/openai/CLIP/archive/refs/heads/main.zip
    - funasr==1.2.7
    - modelscope==1.29.1
    - sentencepiece==0.2.0
    - ftfy==6.2.3
    - regex==2024.11.6
    - editdistance==0.8.1
    - kaldiio==2.18.1
    - optuna==4.5.0
    - tabulate==0.9.0
    - rich==14.1.0
